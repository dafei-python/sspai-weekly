name: 更新「本周看什么」订阅源

on:
  schedule:
    # 北京时间 08:30 与 20:30 各一次（UTC 00:30 / 12:30）
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  push:
    branches: [main]
    paths-ignore: [feed.xml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 feed
        env:
          FEED_URL: ${{ vars.FEED_URL }}
        run: python3 sspai_weekly_feed.py feed.xml

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "chore: 更新 feed.xml"
          git pull --rebase --autostash origin main
          git push

      - name: 刷新 CDN 缓存
        continue-on-error: true
        run: curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed.xml" || true

      - name: 同步到 gh-pages（Pages 发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- feed.xml
          git add feed.xml
          git diff --cached --quiet || git commit -m "pages: 同步 feed.xml"
          git push origin gh-pages
          git checkout main
